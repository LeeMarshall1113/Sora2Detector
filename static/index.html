<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sora2Detector — Upload & Analyze</title>
  <meta http-equiv="x-content-type-options" content="nosniff" />
  <style>
    :root {
      --ok: #0a7a2a;
      --err: #b00020;
      --muted: #666;
      --card-border: #ddd;
      --shadow: 0 4px 10px rgba(0,0,0,0.06);
      --bg: #fafafa;
      --focus: 2px solid #4c8bf5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #aaa;
        --card-border: #2b2b2b;
        --bg: #111;
      }
      body, .card, button { background: #161616; color: #eee; }
      pre { background: #0e0e0e; color: #eaeaea; }
      .bar { background: #222; }
      .chip-human { background: #183a25; color: #9ee2b4; border-color:#2c6b41; }
      .chip-ai { background:#3a1a1f; color:#ff99a6; border-color:#6d2d36; }
      input[type="file"] { color: #ddd; }
      code { color: #ddd; }
    }
    *:focus-visible { outline: var(--focus); outline-offset: 3px; border-radius: 6px; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial; margin: 2rem; background: #fff; color: #111; }
    .card { border: 1px solid var(--card-border); border-radius: 14px; padding: 1rem 1.25rem; margin-top: 1rem; box-shadow: var(--shadow); background: #fff; }
    .row { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    pre { background: #0a0a0a; color: #eaeaea; padding: 1rem; border-radius: 10px; overflow: auto; }
    .badge { border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 0.95rem; font-weight: 600; }
    .chip-ai { background: #fde7ea; color: var(--err); border: 1px solid #f3c6cd; }
    .chip-human { background: #e7f7ec; color: var(--ok); border: 1px solid #bfe8cd; }
    button { padding: .6rem 1rem; border-radius: 8px; border: 1px solid #bbb; background: var(--bg); cursor: pointer; }
    button:hover { background: #f0f0f0; }
    button[disabled] { opacity: .6; cursor: not-allowed; }
    input[type="file"] { padding: .4rem; }
    .bar { height: 10px; background: #eee; border-radius: 999px; overflow: hidden; margin-top: .5rem; }
    .bar > div { height: 100%; width: 0; background: #888; transition: width .3s ease; }
    .bar.ai > div { background: var(--err); }
    .bar.human > div { background: var(--ok); }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: .25rem 1rem; margin-top: .5rem; }
    .kv div:nth-child(odd){ color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { text-align: left; padding: .4rem .25rem; border-bottom: 1px dashed #e6e6e6; font-size: .95rem; }
    th { color: #333; }
    td code { color: #333; }
    .dropzone {
      border: 2px dashed #bbb; border-radius: 12px; padding: .8rem 1rem; transition: background .15s, border-color .15s;
    }
    .dropzone.dragover {
      background: rgba(76, 139, 245, .08);
      border-color: #4c8bf5;
    }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid currentColor; border-right-color: transparent;
      display: inline-block; vertical-align: text-bottom; animation: spin .8s linear infinite;
      margin-left: .5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .preview {
      max-width: 100%; border-radius: 8px; margin-top: .5rem; display: none;
    }
  </style>
</head>
<body>
  <h1>🔎 Sora2Detector</h1>
  <p class="muted">Upload an <strong>.mp4</strong>. The server runs detectors and returns per-detector results plus an overall decision.</p>

  <div class="card">
    <form id="form" class="row" aria-describedby="status" novalidate>
      <div class="dropzone" id="dropzone">
        <label for="file"><strong>Video file</strong></label><br />
        <input id="file" name="file" type="file" accept="video/mp4" required aria-required="true" />
        <div class="muted" style="margin-top:.25rem">Max 200 MB. MP4 only.</div>
        <video id="preview" class="preview" controls playsinline></video>
      </div>
      <div style="display:flex; gap:.5rem; align-items:center;">
        <button id="submitBtn" type="submit">Analyze</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
      <span id="status" class="badge" aria-live="polite">Idle</span>
    </form>
  </div>

  <div id="results"></div>

  <script>
    // ------- Elements -------
    const form = document.getElementById('form');
    const fileInput = document.getElementById('file');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dropzone = document.getElementById('dropzone');
    const preview = document.getElementById('preview');

    // ------- Config -------
    const MAX_BYTES = 200 * 1024 * 1024; // 200 MB
    const ACCEPTED_TYPES = ['video/mp4'];

    // ------- Utils -------
    function setBusy(isBusy, msg) {
      submitBtn.disabled = isBusy;
      fileInput.disabled = isBusy;
      statusEl.textContent = msg || (isBusy ? 'Working…' : 'Idle');
      if (isBusy && !statusEl.querySelector('.spinner')) {
        const sp = document.createElement('span');
        sp.className = 'spinner';
        statusEl.appendChild(sp);
      }
      if (!isBusy) {
        const sp = statusEl.querySelector('.spinner');
        if (sp) sp.remove();
      }
    }
    function filenameOnly(p){ try { return (p || '').split(/[\\/]/).pop(); } catch { return p || ''; } }
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/\//g, '&#x2F;');
    }
    function clamp01(x){ return Math.min(1, Math.max(0, x)); }
    function isObject(x){ return x && typeof x === 'object' && !Array.isArray(x); }

    // ------- Drag & drop -------
    ['dragenter','dragover'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('dragover'); }));
    dropzone.addEventListener('drop', e => {
      const f = e.dataTransfer?.files?.[0];
      if (f) { fileInput.files = e.dataTransfer.files; handlePreview(f); }
    });

    // ------- Preview -------
    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      if (f) handlePreview(f);
    });
    function handlePreview(file){
      if (!ACCEPTED_TYPES.includes(file.type)) { preview.style.display = 'none'; preview.removeAttribute('src'); return; }
      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.style.display = 'block';
      // Optional: revoke after load to free memory
      preview.onloadeddata = () => { URL.revokeObjectURL(url); };
    }

    // ------- Reset -------
    resetBtn.addEventListener('click', () => {
      form.reset();
      resultsEl.innerHTML = '';
      statusEl.textContent = 'Idle';
      preview.style.display = 'none';
      preview.removeAttribute('src');
    });

    // ------- Submit -------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files?.[0];
      if (!file) { statusEl.textContent = 'Choose a file'; fileInput.focus(); return; }

      // Client-side validation
      if (!ACCEPTED_TYPES.includes(file.type)) {
        statusEl.textContent = 'Unsupported type (MP4 only).';
        return;
      }
      if (file.size > MAX_BYTES) {
        statusEl.textContent = `File too large (${(file.size/1024/1024).toFixed(1)} MB). Max 200 MB.`;
        return;
      }

      resultsEl.innerHTML = '';
      setBusy(true, 'Uploading…');

      const fd = new FormData();
      fd.append('file', file, file.name);

      let data;
      try {
        const resp = await fetch('/analyze', { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
        // If the server returns text on error, surface it
        if (!resp.ok) {
          const text = await resp.text().catch(()=>'');
          throw new Error(text || `HTTP ${resp.status}`);
        }
        statusEl.textContent = 'Processing…';
        // Defensive parse in case content-type is wrong
        const text = await resp.text();
        try { data = JSON.parse(text); }
        catch { throw new Error('Response was not valid JSON.'); }
      } catch (err) {
        setBusy(false, 'Error');
        renderError(`Upload failed: ${String(err && err.message || err)}`);
        return;
      }

      try {
        // Expecting: { file, results, overall_ai }
        const filePath = data?.file ?? '';
        const results = isObject(data?.results) ? data.results : {};
        const overall_ai = isObject(data?.overall_ai) ? data.overall_ai : null;

        setBusy(false, 'Done');

        renderOverall(filePath, overall_ai, results);
        renderDetectors(results);
      } catch (err) {
        setBusy(false, 'Error');
        renderError(`Render failed: ${String(err)}`);
      }
    });

    // ------- Rendering -------
    function renderOverall(filepath, overall_ai, results){
      const decision = String(overall_ai?.decision ?? overall_ai?.Decision ?? 'Unknown');
      const reason = overall_ai?.details?.reason ?? overall_ai?.reason ?? '';
      const pDict = overall_ai?.details?.p ?? {};
      let videoPct = overall_ai?.details?.video_pct;

      // Fallback: parse from Video.short
      if (videoPct == null && results?.Video?.short) {
        const m = String(results.Video.short).match(/(\d+(?:\.\d+)?)\s*%/);
        if (m) videoPct = parseFloat(m[1]);
      }
      if (typeof videoPct === 'number') {
        videoPct = Math.max(0, Math.min(100, videoPct));
      }

      const isAI = decision.toLowerCase() === 'ai';
      const fname = filenameOnly(filepath || '');

      const banner = document.createElement('div');
      banner.className = 'card';
      banner.style.borderLeft = isAI ? '6px solid var(--err)' : '6px solid var(--ok)';

      const pctText = (typeof videoPct === 'number') ? `${videoPct.toFixed(0)}%` : '—';

      banner.innerHTML = `
        <div class="row" style="align-items:flex-start">
          <div>
            <h3 style="margin:.15rem 0 .35rem 0">Overall Analysis</h3>
            <div class="muted">File: <code>${escapeHtml(fname)}</code></div>
          </div>
          <span class="badge ${isAI ? 'chip-ai' : 'chip-human'}">${escapeHtml(decision)}</span>
        </div>

        <div class="kv" style="margin:.25rem 0 .5rem 0">
          <div>Video Estimate</div><div><strong>${pctText}</strong></div>
          <div>Reason</div><div>${escapeHtml(reason || '—')}</div>
        </div>

        ${typeof videoPct === 'number' ? `
          <div class="bar ${isAI ? 'ai' : 'human'}" aria-label="AI likelihood bar" role="img">
            <div style="width:${videoPct}%;"></div>
          </div>
        ` : ''}
      `;

      resultsEl.appendChild(banner);

      // Optional: show model probabilities table if present
      if (isObject(pDict) && Object.keys(pDict).length) {
        const tbl = document.createElement('div');
        tbl.className = 'card';
        const rows = Object.entries(pDict)
          .sort((a,b)=>b[1]-a[1])
          .map(([k,v]) => `<tr><td><code>${escapeHtml(k)}</code></td><td>${(clamp01(Number(v))*100).toFixed(1)}%</td></tr>`)
          .join('');
        tbl.innerHTML = `
          <h3 style="margin-top:0">Model Breakdown</h3>
          <table><thead><tr><th>Model</th><th>Probability</th></tr></thead>
          <tbody>${rows}</tbody></table>
        `;
        resultsEl.appendChild(tbl);
      }
    }

    function renderDetectors(results){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3 style="margin-top:0">Detectors</h3>`;

      const obj = isObject(results) ? results : {};
      const entries = Object.entries(obj);
      if (!entries.length) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'No per-detector results found.';
        card.appendChild(empty);
      } else {
        for (const [name, payload] of entries) {
          const sec = document.createElement('section');
          sec.style.marginTop = '1rem';
          const short = payload?.short ?? '';
          const full = payload?.full ?? '';
          const isErr = /ERROR|TIMEOUT|not found/i.test(String(short));

          sec.innerHTML = `
            <div class="row">
              <strong>${escapeHtml(name)}</strong>
              <span class="badge ${isErr ? 'chip-ai' : 'chip-human'}">${isErr ? 'Issue' : 'OK'}</span>
            </div>
            <div class="muted" style="margin-top:.15rem; white-space:pre-wrap">${escapeHtml(short)}</div>
            <details style="margin-top:.5rem;">
              <summary>Full output</summary>
              <pre>${escapeHtml(full)}</pre>
              <div style="margin-top:.5rem">
                <button type="button" data-copy="${escapeHtml(full)}" class="copyBtn">Copy output</button>
              </div>
            </details>
          `;
          card.appendChild(sec);
        }
      }
      resultsEl.appendChild(card);

      // Wire copy buttons
      card.querySelectorAll('.copyBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = btn.getAttribute('data-copy') || '';
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied!';
            setTimeout(()=> btn.textContent = 'Copy output', 1200);
          } catch {
            btn.textContent = 'Copy failed';
            setTimeout(()=> btn.textContent = 'Copy output', 1200);
          }
        });
      });
    }

    function renderError(msg){
      const card = document.createElement('div');
      card.className = 'card';
      card.style.borderLeft = '6px solid var(--err)';
      card.innerHTML = `<strong>Error</strong><p class="muted" style="white-space:pre-wrap">${escapeHtml(msg)}</p>`;
      resultsEl.appendChild(card);
    }
  </script>
</body>
</html>
